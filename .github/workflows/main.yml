name: Build and Run GoogleTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3️⃣ Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # 4️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GameEngine.sln

      - name: Build Physics Engine
        shell: pwsh
        run: |
          $projPath = "GameEngine\PhysicsEngine\PhysicsEngine.vcxproj"
          Write-Host "Building project at $projPath"
          msbuild "$projPath" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build TestPhysicsEngine
        shell: pwsh
        run: |
          $projPath = "GameEngine\TestPhysicsEngine\TestPhysicsEngine.vcxproj"
          Write-Host "Building project at $projPath"
          msbuild "$projPath" /p:Configuration=Release /p:Platform=x64 /m

      # 7️⃣ Run GoogleTest
      - name: Run GoogleTest
        shell: pwsh
        run: |
          $exePath = "GameEngine\x64\Release\TestPhysicsEngine.exe"

          if (-Not (Test-Path $exePath)) {
              Write-Error "❌ TestPhysicsEngine.exe not found at $exePath"
              exit 1
          }

          Write-Host "✅ Found TestPhysicsEngine.exe at $exePath"
          Write-Host "Running tests..."
          & $exePath --gtest_color=yes
