name: Build and Run GoogleTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3️⃣ Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # 4️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GameEngine.sln

      - name: Build Physics Engine
        shell: pwsh
        run: |
          $projPath = "PhysicsEngine\PhysicsEngine.vcxproj"
          Write-Host "Building project at $projPath"
          msbuild "$projPath" /p:Configuration=Release /p:Platform=x64 /p:AdditionalIncludeDirectories="D:\a\GameEngine\Dependencies\GLM\include" /m

      # 6️⃣ Build TestPhysicsEngine - FIXED PATH
      - name: Build TestPhysicsEngine
        shell: pwsh
        run: |
          $projPath = "TestPhysicsEngine\TestPhysicsEngine.vcxproj"
          Write-Host "Building project at $projPath"
          msbuild "$projPath" /p:Configuration=Release /p:Platform=x64 /m

      # 7️⃣ Run GoogleTest - FIXED PATH
      - name: Run GoogleTest
        shell: pwsh
        run: |
          # First, let's find where the executable actually is
          Write-Host "Searching for TestPhysicsEngine.exe..."
          $exePath = Get-ChildItem -Path . -Recurse -Filter "TestPhysicsEngine.exe" | 
                     Where-Object { $_.FullName -like "*Release*" } | 
                     Select-Object -First 1
          
          if ($null -eq $exePath) {
              Write-Error "❌ TestPhysicsEngine.exe not found"
              Write-Host "`n📁 All .exe files found:"
              Get-ChildItem -Path . -Recurse -Include *.exe -Name
              exit 1
          }
          
          Write-Host "✅ Found TestPhysicsEngine.exe at: $($exePath.FullName)"
          Write-Host "Running tests..."
          & $exePath.FullName --gtest_color=yes
